<!DOCTYPE html>
<html lang="en">

    <link rel="alternate" hreflang="x-default" href="https://ai3613.com/en" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f8f9;
        color: #14181c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand span { color: #c8442a; }
      .hint { color: #5b6570; font-size: 15px; margin: 0; }
      .langs { margin-top: 6px; font-size: 16px; }
      .langs a {
        color: #14181c;
        text-decoration: none;
        border: 1px solid #d8dde2;
        border-radius: 6px;
        padding: 8px 16px;
        margin: 0 6px;
        display: inline-block;
      }
      .langs a:hover { border-color: #14181c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Blue <span>Carbon</span></div>
      <p class="hint">Loading…</p>

        <a href="/ar" dir="rtl">العربية</a>
        <a href="/de">Deutsch</a>
      </p>
    </div>
    <noscript>
      <meta http-equiv="refresh" content="0;url=/en" />
    </noscript>
    <script>
      (function () {
        var target = "/en";
        try {
          var lang = (navigator.language || navigator.userLanguage || "").toLowerCase();
          if (lang.indexOf("ar") === 0) target = "/ar";
          else if (lang.indexOf("de") === 0) target = "/de";
        } catch (e) {}
        window.location.replace(target);
      })();
    </script>
